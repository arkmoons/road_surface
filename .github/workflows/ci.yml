name: CI/CD Pipeline
on:
  push:
    branches: [main, dev, staging, 11]
  pull_request:
    branches: [main, dev, staging, 11]
permissions:
  contents: read
jobs:
  tests:
    name: Run application tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies (no-editable, from pyproject.toml .[dev])
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run pytest unit tests (APP/test_app.py)
        run: |
          export PYTHONPATH=.
          python -m pytest APP/test_app.py -v --cov=APP --cov-report=xml --cov-report=term --junitxml=report-app.xml
      - name: Upload pytest test report (always run)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-junit-report
          path: report-app.xml
          retention-days: 7
