name: CI/CD

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ #
  # CI: run for every PR to a protected branch AND every push to
  # staging/main. Tests, lint, and a Docker build must all pass.
  # ------------------------------------------------------------------ #
  test:
    name: Test, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Run test suite
        run: python -m pytest -q

      - name: Build Docker image (verify it builds)
        run: docker build -t road-surface:ci .

  # ------------------------------------------------------------------ #
  # CD (staging): merge to staging -> build & publish the staging image.
  # The stage .env is created from staging-specific GitHub secrets.
  # ------------------------------------------------------------------ #
  deploy-staging:
    name: Build and publish staging image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create staging .env from secrets
        run: |
          cat > .env <<EOF
          APP_ENV=staging
          MODEL_PATH=${{ secrets.STAGING_MODEL_PATH || 'models/current.pt' }}
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_ENV=staging
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/road-surface:staging
            ${{ secrets.DOCKERHUB_USERNAME }}/road-surface:staging-sha-${{ github.sha }}

  # ------------------------------------------------------------------ #
  # CD (production): merge to main -> build & publish the production
  # image. The prod .env is created from production-specific secrets.
  # ------------------------------------------------------------------ #
  deploy-prod:
    name: Build and publish production image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create production .env from secrets
        run: |
          cat > .env <<EOF
          APP_ENV=production
          MODEL_PATH=${{ secrets.PROD_MODEL_PATH || 'models/current.pt' }}
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_ENV=production
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/road-surface:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/road-surface:sha-${{ github.sha }}
