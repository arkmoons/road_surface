[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "road-surface-mlops"
version = "0.1.0"
description = "路面状态图像分类 MLOps 项目"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "mlflow>=2.10",
    "dvc[s3]>=3.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "Pillow>=10.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.25",
    "mypy>=1.5",
]

[tool.setuptools]
packages = ["app", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
